services:
  backend:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports: ["8000:8000"]
  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]
